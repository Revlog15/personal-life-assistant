name: PersonalLifeAssistant
options:
  bundleIdPrefix: id.revand
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  PLACore:
    path: Packages/PLACore
  PLAData:
    path: Packages/PLAData

targets:
  PLAApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/PLAApp
        excludes:
          - "Info.plist"
    dependencies:
      - package: PLACore
      - package: PLAData
    info:
      path: App/PLAApp/Info.plist
      properties:
        CFBundleDisplayName: Life Assistant
        CFBundleDevelopmentRegion: id
        CFBundleLocalizations:
          - id
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - id.pla.refresh-notifications
        NSFaceIDUsageDescription: Personal Life Assistant menggunakan Face ID untuk melindungi halaman Keuangan agar saldo dan transaksi Anda tetap pribadi.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.revand.pla
        PRODUCT_NAME: PLAApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO

schemes:
  PLAApp:
    build:
      targets:
        PLAApp: all
    run:
      config: Debug
    archive:
      config: Release
